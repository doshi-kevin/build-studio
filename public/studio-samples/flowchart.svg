<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Flowchart">
  <rect width="320" height="200" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="160" y1="48" x2="160" y2="70"/>
    <line x1="160" y1="118" x2="160" y2="140"/>
  </g>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <rect x="110" y="20" width="100" height="28" rx="14"/>
    <rect x="110" y="150" width="100" height="28" rx="14"/>
  </g>
  <polygon points="160,72 210,94 160,116 110,94" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <g fill="#1e293b" font-family="sans-serif" font-size="12" text-anchor="middle">
    <text x="160" y="38">Start</text>
    <text x="160" y="98">Decision</text>
    <text x="160" y="168">End</text>
  </g>
</svg>
